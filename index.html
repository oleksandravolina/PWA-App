<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>PWA Camera</title>
</head>

<body>

<div id="app">

<div id="homeView" class="view active">
  <h1>PWA Camera</h1>
  <button onclick="showView('featuresView')">Explore Features</button>
</div>

<div id="featuresView" class="view">
  <button onclick="showView('homeView')">Back</button>

  <h2>Camera</h2>
  <button onclick="openCamera()">Open Camera</button>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <div id="cameraResult">
    <img id="capturedImage">
  </div>

  <button onclick="showView('galleryView')">Open Gallery</button>
</div>

<div id="galleryView" class="view">
  <button onclick="showView('featuresView')">Back</button>
  <h2>Gallery</h2>
  <div id="savedPhotos"></div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
